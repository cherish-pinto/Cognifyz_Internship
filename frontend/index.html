<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 6: Database Integration & Authentication</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="auth-container" class="container hidden">
      <div class="auth-box">
        <div class="auth-tabs">
          <button id="login-tab" class="tab-btn active" data-tab="login">Login</button>
          <button id="register-tab" class="tab-btn" data-tab="register">Register</button>
        </div>
        
        <div id="login-form" class="form-container">
          <h2>Login</h2>
          <form id="loginForm">
            <div class="form-group">
              <label for="login-email">Email</label>
              <input type="email" id="login-email" required>
            </div>
            <div class="form-group">
              <label for="login-password">Password</label>
              <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn-primary">Login</button>
          </form>
          <div id="login-message" class="message"></div>
        </div>
        
        <div id="register-form" class="form-container hidden">
          <h2>Register</h2>
          <form id="registerForm">
            <div class="form-group">
              <label for="register-username">Username</label>
              <input type="text" id="register-username" required>
            </div>
            <div class="form-group">
              <label for="register-email">Email</label>
              <input type="email" id="register-email" required>
            </div>
            <div class="form-group">
              <label for="register-password">Password</label>
              <input type="password" id="register-password" required>
            </div>
            <button type="submit" class="btn-primary">Register</button>
          </form>
          <div id="register-message" class="message"></div>
        </div>
      </div>
    </div>
    
    <div id="dashboard-container" class="container">
      <header class="navbar">
        <h1>Dashboard</h1>
        <button id="logout-btn" class="btn-logout">Logout</button>
      </header>
      
      <main class="dashboard-content">
        <div class="form-section">
          <h2>Submit Form</h2>
          <form id="dataForm">
            <div class="form-row">
              <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" required>
              </div>
              <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
              </div>
              <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" required>
              </div>
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn-primary">Submit Form</button>
          </form>
          <div id="form-message" class="message"></div>
        </div>
        
        <div class="data-section">
          <h2>Your Submitted Data</h2>
          <div id="data-list" class="data-list"></div>
        </div>
      </main>
    </div>
  </div>
  
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
